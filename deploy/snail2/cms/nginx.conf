server {
    listen 0.0.0.0:6767;
    server_name _;
    absolute_redirect off;
    client_max_body_size 16m;
    access_log /var/log/nginx/tigapilardewata.access.log;
    error_log /var/log/nginx/tigapilardewata.error.log;
    location / {
        proxy_pass http://127.0.0.1:46767;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # The public HTTPS origin terminates at the upstream reverse proxy/tunnel.
        # CMS_ORIGIN is fixed in the service environment; don't trust client headers.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
