server {
    listen 0.0.0.0:6767;
    server_name _;
    root /var/www/tigapilardewata/current;
    index index.html;
    absolute_redirect off;

    access_log /var/log/nginx/tigapilardewata.access.log;
    error_log /var/log/nginx/tigapilardewata.error.log;

    location = /tentang/ { return 301 /id/tentang/$is_args$args; }
    location = /kemitraan/ { return 301 /id/kemitraan/$is_args$args; }
    location = /kontak/ { return 301 /id/kontak/$is_args$args; }

    error_page 404 /404.html;
    location = /404.html { }
    location / { try_files $uri $uri/ =404; }
}
